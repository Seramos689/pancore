<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANCORE – Verify Email</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231e90ff'/><text x='50' y='62' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>P</text></svg>" />
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4fc3f7"/>
            <stop offset="100%" stop-color="#1565c0"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22" stroke="url(#logoGrad)" stroke-width="2.5" fill="rgba(30,144,255,0.12)"/>
        <path d="M14 30V18h7.5c3.2 0 5.2 1.7 5.2 4.2 0 1.8-1 3.2-2.6 3.8L28 30h-3.2l-3.4-3.6H17.2V30H14zm3.2-6.2h4c1.5 0 2.4-.7 2.4-1.9s-.9-1.9-2.4-1.9h-4v3.8z" fill="url(#logoGrad)"/>
        <circle cx="34" cy="14" r="3.5" fill="#4fc3f7"/>
      </svg>
      <span>PANCORE</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html" class="btn btn-primary btn-sm" style="width:auto;padding:0.45rem 1rem;">Register</a>
    </nav>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Verify Your Email</h1>
        <p>Enter the verification code to activate your account.</p>
      </div>

      <div id="formAlert" class="alert"></div>

      <div id="demoHint" class="alert alert-info" style="display:none;">
        <strong>Demo mode:</strong> Code has been pre-filled. In a real app this would be sent by email.
      </div>

      <form id="verifyForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" readonly style="opacity:0.85;" />
        </div>

        <div class="form-group">
          <label for="code">Verification Code <span class="required">*</span></label>
          <input type="text" id="code" name="code" placeholder="Enter code" maxlength="12" required
                 style="text-transform:uppercase; letter-spacing:2px; font-weight:600; text-align:center; font-size:1.15rem;" />
        </div>

        <button type="submit" class="btn btn-primary">Verify Email</button>
      </form>

      <div style="text-align:center; margin-top:1.25rem;">
        <button type="button" id="resendBtn" class="btn btn-outline btn-sm">Resend Code</button>
      </div>

      <div class="auth-footer">
        Already verified? <a href="login.html">Go to Login</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
